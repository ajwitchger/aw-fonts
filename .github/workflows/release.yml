name: Publish font artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Immutable release tag (vYYYY.MM.N)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-font-artifacts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Require main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release publication is allowed only from main." >&2
            exit 1
          fi

      - name: Validate release tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "release_tag must match vYYYY.MM.N (example: v2026.09.1)" >&2
            exit 1
          fi
          echo "value=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate release inputs
        run: python scripts/validate.py --require-fonts

      - name: Build artifacts
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          python scripts/build.py \
            --version "${RELEASE_TAG}" \
            --source-ref "${GITHUB_SHA}" \
            --output dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Refuse an existing release or tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists." >&2
            exit 1
          fi
          if git rev-parse "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists." >&2
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --draft \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TAG}" \
            --notes "Validated aw-fonts artifacts built from commit ${GITHUB_SHA}."

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" dist/*

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "${RELEASE_TAG}" --draft=false --latest
